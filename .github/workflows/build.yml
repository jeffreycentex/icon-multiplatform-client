name: test-and-build

# Every push to main and every pull request: run the tests on macOS, Windows
# and Linux, then build the standalone app on each and upload it as an
# artifact (Actions run page -> Artifacts). Tags v* also attach the archives
# to a GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write          # for attaching archives to a release on v* tags

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Linux system libraries (PortAudio, Qt runtime)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/ci_run.py

      - name: Build and self-check
        if: success() || failure()          # build even when tests fail, to learn both
        env:
          CI: "1"
        run: python build.py --no-install

      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: IcomRemote-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            build/check.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
